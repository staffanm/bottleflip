<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".5" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e6dcc8"/>
    </radialGradient>
    <linearGradient id="shell" x1="-60" y1="0" x2="60" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#dce6f0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#b4c3d7" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="30" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a9ef0"/>
      <stop offset="1" stop-color="#1464be"/>
    </linearGradient>
    <clipPath id="inside">
      <path id="body" d="M-50 150 H50 Q60 150 60 140 V-40 Q60 -80 22 -108 H-22 Q-60 -80 -60 -40 V140 Q-60 150 -50 150 Z"/>
    </clipPath>
  </defs>

  <rect class="bg" width="512" height="512" fill="url(#bg)"/>

  <!-- spin arcs around the centre of mass -->
  <g fill="none" stroke="#0f766e" stroke-linecap="round">
    <path d="M118 150 A170 170 0 0 1 300 92" stroke-width="14" opacity=".9"/>
    <path d="M300 92 l-26 -22 M300 92 l-30 18" stroke-width="14" opacity=".9"/>
    <path d="M394 362 A170 170 0 0 1 212 420" stroke-width="14" opacity=".9"/>
    <path d="M212 420 l26 22 M212 420 l30 -18" stroke-width="14" opacity=".9"/>
  </g>

  <g transform="translate(256 262) rotate(130) translate(0 -20) scale(1.15)">
    <!-- shell -->
    <use href="#body" fill="url(#shell)"/>
    <g clip-path="url(#inside)">
      <!-- water flung to the base: curved free surface around the spin centre, crest climbing the trailing wall -->
      <path d="M-64 160 V-10 C-56 -30 -34 -36 -18 -24 C-6 -14 -4 -2 -14 4 C-22 -6 -32 -6 -34 6 C-34 30 -26 66 -4 80 C18 92 40 86 64 72 V160 Z" fill="url(#water)"/>
      <!-- surface highlight along the crest and the free surface -->
      <path d="M-58 -10 C-50 -28 -32 -32 -18 -22 M-34 8 C-34 30 -26 66 -4 80 C18 92 40 86 60 74" fill="none" stroke="#c4e4ff" stroke-width="5" stroke-linecap="round"/>
      <!-- bubbles in the water -->
      <g fill="#fff" opacity=".55">
        <circle cx="-30" cy="112" r="7"/><circle cx="10" cy="126" r="4"/><circle cx="36" cy="106" r="5"/>
        <circle cx="-14" cy="98" r="3.5"/><circle cx="-46" cy="60" r="4.5"/><circle cx="-48" cy="20" r="3"/>
      </g>
      <!-- spray torn off the crest -->
      <g fill="#2b8fe6">
        <circle cx="2" cy="-8" r="8"/><circle cx="20" cy="-28" r="6"/><circle cx="6" cy="-46" r="5"/>
        <circle cx="36" cy="-8" r="4.5"/><circle cx="28" cy="-56" r="3.5"/>
      </g>
    </g>
    <!-- outline and shine -->
    <use href="#body" fill="none" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-48" y="-50" width="9" height="170" rx="4.5" fill="#fff" opacity=".8"/>
    <rect x="34" y="-40" width="6" height="150" rx="3" fill="#fff" opacity=".45"/>
    <!-- cap -->
    <rect x="-26" y="-140" width="52" height="34" rx="4" fill="#1c1a17" stroke="#1e293b" stroke-width="4"/>
    <rect x="-26" y="-112" width="52" height="7" fill="#e2b652"/>
    <g fill="#fff" opacity=".2"><rect x="-17" y="-136" width="4" height="20"/><rect x="-5" y="-136" width="4" height="20"/><rect x="7" y="-136" width="4" height="20"/><rect x="19" y="-136" width="4" height="20"/></g>
  </g>
</svg>
